<script>

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

document.querySelectorAll(".series").forEach(series => {

    const images = Array.from(series.querySelectorAll(".series-img"));

    // shuffle
    const shuffled = shuffle(images);

    // reset all active states FIRST
    shuffled.forEach(img => img.classList.remove("active"));

    // re-append in shuffled order
    shuffled.forEach(img => series.appendChild(img));

    // set first image active AFTER shuffle
    let current = 0;
    shuffled[current].classList.add("active");

    series.addEventListener("click", (e) => {

        const rect = series.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;

        shuffled[current].classList.remove("active");

        if (clickX < width / 2) {
            current = (current - 1 + shuffled.length) % shuffled.length;
        } else {
            current = (current + 1) % shuffled.length;
        }

        shuffled[current].classList.add("active");
    });

});
    
// INVERT MODE

const invertToggle = document.getElementById("invert-toggle");

invertToggle.addEventListener("click", () => {
    document.body.classList.toggle("invert-mode");
});

</script>
