<body>

        <a href="about.html">Caroline King</a>

    </div>
    <div class="center"><a href="index.html">HOME</a></div>
    <div class="right">
        <a href="https://www.instagram.com/caroline____king/" target="_blank">@caroline____king</a>
        <a href="mailto:carolinegkingart@email.com">carolinegkingart@gmail.com</a>
    </div>
</div>

<h2 class="portfolio-title">PORTFOLIO</h2>

<div class="gallery">

    <!-- OPENING ROW -->

    <div class="opening-row">

        <div class="series large-series">
            <img src="Blooms 2026.jpg" class="series-img active">
            <img src="cloud.jpg" class="series-img">
            <img src="daffodil.JPG" class="series-img">
        </div>

        <div class="series small-series">
            <img src="Bk Building.jpg" class="series-img active">
            <img src="Bk Church.jpg" class="series-img">
            <img src="Announcer.JPEG" class="series-img">
        </div>

    </div>

    <!-- SERIES -->

    <div class="series vertical-series">
        <img src="domarabiamt3.jpg" class="series-img active">
        <img src="domarabiamt2.JPG" class="series-img">
        <img src="domarabiamt.JPG" class="series-img">
    </div>

    <div class="series vertical-series">
        <img src="AriainRed.JPEG" class="series-img active">
        <img src="aria1.jpg" class="series-img">
        <img src="Dani.JPEG" class="series-img">
    </div>

    <div class="series vertical-series">
        <img src="FunnyBunny.jpeg" class="series-img active">
        <img src="PrinceCharming.jpg" class="series-img">
        <img src="Grinch.jpg" class="series-img">
    </div>

</div>

<script>

document.querySelectorAll(".series").forEach(series => {

    const images = series.querySelectorAll(".series-img");
    let current = 0;

    series.addEventListener("click", (e) => {

        const rect = series.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;

        images[current].classList.remove("active");

        if (clickX < width / 2) {
            current = (current - 1 + images.length) % images.length;
        } else {
            current = (current + 1) % images.length;
        }

        images[current].classList.add("active");
    });

});

</script>

</body>
</html>
